[project]
name = "commander-sim"
version = "0.1.0"
description = "Headless Forge Commander simulation harness for decklist evaluation"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "numpy>=2.4.6",
    "platformdirs>=4",
    "psutil>=7.2.2",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.12",
]

[project.scripts]
commander-sim = "commander_sim.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commander_sim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: slow tests that run Forge (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"
